apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hindsight
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/hindsight
  prune: true
  # Isolé : un souci Hindsight ne bloque jamais les autres apps.
  wait: false
  timeout: 15m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
