apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-policies
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/kyverno-policies
  prune: true
  dependsOn:
    - name: kyverno       # les ClusterPolicy CRDs viennent du controller
  wait: false
  timeout: 5m
