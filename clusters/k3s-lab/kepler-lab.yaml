apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kepler-lab
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/kepler-lab
  prune: true
  # isole comme kepler : le harnais de mesure ne doit jamais bloquer les apps
  wait: false
  timeout: 5m
  dependsOn:
    - name: kepler
