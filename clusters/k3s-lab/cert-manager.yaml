apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/cert-manager
  prune: true
  # wait:true -> on attend que le controller + webhook soient sains avant
  # d'appliquer les issuers (qui dependent des CRDs et du webhook).
  wait: true
  timeout: 8m
