apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: tetragon, namespace: flux-system}
spec:
  interval: 10m
  sourceRef: {kind: GitRepository, name: flux-system}
  path: ./apps/tetragon
  prune: true
  wait: false
  timeout: 10m
---
# Les TracingPolicies ont besoin des CRDs posées par le chart : Kustomization séparée qui réessaie.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: tetragon-policies, namespace: flux-system}
spec:
  interval: 10m
  retryInterval: 1m
  dependsOn: [{name: tetragon}]
  sourceRef: {kind: GitRepository, name: flux-system}
  path: ./apps/tetragon-policies
  prune: true
  wait: false
