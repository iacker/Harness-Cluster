apiVersion: v1
kind: Namespace
metadata:
  name: trivy-system
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: aqua
  namespace: trivy-system
spec:
  interval: 24h
  url: https://aquasecurity.github.io/helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: trivy-system
spec:
  interval: 24h
  chart:
    spec:
      chart: trivy-operator
      version: "0.35.0"
      sourceRef:
        kind: HelmRepository
        name: aqua
        namespace: trivy-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # node1 est le control-plane (2 vCPU / 3.8Go) et sature en I/O.
    # On eloigne les jobs de scan (gros conso CPU+IO) vers cloud4dev.
    trivyOperator:
      scanJobAffinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
    operator:
      scanJobsConcurrentLimit: 1
      vulnerabilityScannerEnabled: true
      configAuditScannerEnabled: true
      rbacAssessmentScannerEnabled: true
      # Desactive: le node-collector exige hostPID + hostPath (/var/lib/etcd,
      # /etc/kubernetes...) et viole le PodSecurity "baseline" du namespace.
      # Sans ca, le job node-collector boucle en FailedCreate toutes les 30s.
      infraAssessmentScannerEnabled: false
      clusterComplianceEnabled: false
      exposedSecretScannerEnabled: true
      sbomGenerationEnabled: false
    trivy:
      ignoreUnfixed: true
      severity: CRITICAL,HIGH
      resources:
        requests: {cpu: "100m", memory: "128Mi"}
        limits: {cpu: "500m", memory: "512Mi"}
    resources:
      requests: {cpu: "100m", memory: "128Mi"}
      limits: {cpu: "500m", memory: "512Mi"}
