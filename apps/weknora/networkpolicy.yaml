# Postgres / Redis / docreader : joignables uniquement depuis le namespace.
# Frontend : Traefik (kube-system) + namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: weknora-backends
  namespace: weknora
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: In, values: [database, cache, docreader]}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: weknora-frontend
  namespace: weknora
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: frontend}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
        - podSelector: {}
