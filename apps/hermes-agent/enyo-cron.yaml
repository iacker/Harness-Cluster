---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: enyo-ticker
  namespace: hermes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: enyo-ticker
  namespace: hermes
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods/exec
  verbs:
  - create
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: enyo-ticker
  namespace: hermes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: enyo-ticker
subjects:
- kind: ServiceAccount
  name: enyo-ticker
  namespace: hermes
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app: enyo
    role: scheduler-tick
  name: enyo-cron-ticker
  namespace: hermes
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata: {}
    spec:
      activeDeadlineSeconds: 110
      template:
        metadata: {}
        spec:
          containers:
          - command:
            - /bin/sh
            - -c
            - POD=$(kubectl -n hermes get pod -l app=hermes --field-selector=status.phase=Running
              -o name | head -1); [ -z "$POD" ] && exit 0; kubectl -n hermes exec
              "$POD" -- sh -lc '/opt/hermes/.venv/bin/hermes cron tick' 2>&1 | tail
              -3
            image: alpine/k8s:1.36.2
            imagePullPolicy: Always
            name: tick
            resources: {}
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          restartPolicy: Never
          schedulerName: default-scheduler
          securityContext: {}
          serviceAccount: enyo-ticker
          serviceAccountName: enyo-ticker
          terminationGracePeriodSeconds: 30
      ttlSecondsAfterFinished: 120
  schedule: '* * * * *'
  successfulJobsHistoryLimit: 1
  suspend: false
  startingDeadlineSeconds: 30

