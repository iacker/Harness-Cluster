---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: enyo-ticker
  namespace: hermes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: enyo-ticker
  namespace: hermes
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: enyo-ticker
  namespace: hermes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: enyo-ticker
subjects:
  - kind: ServiceAccount
    name: enyo-ticker
    namespace: hermes
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app: enyo
    role: scheduler-tick
  name: enyo-cron-ticker
  namespace: hermes
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 110
      ttlSecondsAfterFinished: 120
      template:
        spec:
          serviceAccountName: enyo-ticker
          restartPolicy: Never
          containers:
            - name: tick
              image: alpine/k8s:1.36.2
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - >-
                  POD=$(kubectl -n hermes get pod -l app=hermes
                  --field-selector=status.phase=Running -o name | head -1);
                  [ -z "$POD" ] && exit 0;
                  kubectl -n hermes exec "$POD" -- sh -lc
                  '/opt/hermes/.venv/bin/hermes cron tick' 2>&1 | tail -3
              resources:
                requests: {cpu: "10m", memory: "32Mi"}
                limits: {cpu: "100m", memory: "128Mi"}
