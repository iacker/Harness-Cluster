apiVersion: v1
kind: Namespace
metadata:
  name: hermes
  labels:
    purpose: agentic-lab
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  namespace: hermes
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
  labels:
    app: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: fix-data-permissions
          image: nousresearch/hermes-agent:v2026.8.3
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /opt/data/logs /opt/data/scripts /opt/data/reports
              chown -R hermes:hermes /opt/data/logs /opt/data/scripts /opt/data/reports
              chmod 700 /opt/data/logs
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /opt/data
          resources:
            requests: {cpu: "10m", memory: "32Mi"}
            limits: {cpu: "100m", memory: "128Mi"}
      containers:
        - name: hermes
          image: ghcr.io/iacker/hermes-agent:desktop-web-93508
          imagePullPolicy: Always
          args: ["webapp", "--host", "0.0.0.0", "--port", "9119", "--no-open", "--skip-build"]
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: A2A_HOST
              value: "0.0.0.0"
            - name: HERMES_DASHBOARD_OAUTH_CLIENT_ID
              value: "agent:cmtnhuwqk00t1gm0aoxsmnbhb"
            - name: HERMES_DASHBOARD_PUBLIC_URL
              value: "https://node1.tailff2e6.ts.net"
          envFrom:
            - secretRef: {name: hermes-secrets}
            - secretRef: {name: htb-token, optional: true}
            - secretRef: {name: enyo-github, optional: true}
          ports:
            - containerPort: 9119
              name: gateway
            - containerPort: 9900
              name: a2a
          volumeMounts:
            - name: data
              mountPath: /opt/data
          resources:
            requests: {cpu: "100m", memory: "384Mi"}
            limits: {cpu: "1", memory: "1Gi"}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
---
apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: hermes
spec:
  selector:
    app: hermes
  ports:
    - port: 9119
      targetPort: 9119
      name: gateway
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-a2a
  namespace: hermes
spec:
  selector:
    app: hermes
  ports:
    - port: 9900
      targetPort: 9900
      nodePort: 30900
      name: a2a
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-isolation
  namespace: hermes
spec:
  podSelector:
    matchLabels:
      app: hermes
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {protocol: TCP, port: 9900}
        - {protocol: TCP, port: 9119}
  egress:
    - {}
