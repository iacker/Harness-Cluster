apiVersion: v1
kind: Namespace
metadata:
  name: hermes
  labels:
    purpose: agentic-lab
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data-node3
  namespace: hermes
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
  labels:
    app: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
      annotations:
        # scrape par le job kubernetes-pods : sidecar audit-exporter
        prometheus.io/scrape: "true"
        prometheus.io/port: "9465"
        prometheus.io/path: /metrics
    spec:
      # Nœud applicatif principal (11 Go) ; volume local-path lié à node3.
      nodeSelector:
        kubernetes.io/hostname: node3
      # Le dashboard vérifie la gateway par (pid, start_time) : sans espace de
      # processus partagé il la voit « stopped » alors qu'elle tourne.
      shareProcessNamespace: true
      initContainers:
        - name: fix-data-permissions
          image: nousresearch/hermes-agent:v0.22.4
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /opt/data/logs /opt/data/scripts /opt/data/reports
              # Les deux conteneurs tournent en uid 10000 : tout le volume
              # doit lui appartenir (anciens fichiers root = crons et auth
              # illisibles pour la gateway : Permission denied en boucle).
              chown -R 10000:10000 /opt/data
              [ -f /opt/data/auth.json ] && chmod 600 /opt/data/auth.json || true
              chmod 700 /opt/data/logs
              # Verrou de build du dashboard (/opt/hermes appartient à root dans
              # l'image) : fichier inscriptible monté par subPath.
              touch /work/web_ui_build.lock && chown 10000:10000 /work/web_ui_build.lock
              # Plugin audit_to_db (code depuis le ConfigMap, data/ conservé).
              # L'activation (plugins.enabled) est faite une fois dans config.yaml.
              mkdir -p /opt/data/plugins/audit_to_db/data
              cp /audit-plugin/plugin.yaml /audit-plugin/__init__.py /audit-plugin/db.py /audit-plugin/audit_to_db.yaml /opt/data/plugins/audit_to_db/
              chown -R 10000:10000 /opt/data/plugins/audit_to_db
              chmod 700 /opt/data/plugins/audit_to_db/data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: webapp-work
              mountPath: /work
            - name: audit-plugin
              mountPath: /audit-plugin
              readOnly: true
          resources:
            requests: {cpu: "10m", memory: "32Mi"}
            limits: {cpu: "100m", memory: "128Mi"}
      containers:
        - name: hermes
          # Image officielle (dashboard + chat /chat, OAuth Nous). L'ancienne image
          # perso desktop-web (PR #93508, jamais mergée) a été abandonnée le 22/10/2026.
          image: nousresearch/hermes-agent:v0.22.4
          imagePullPolicy: IfNotPresent
          args: ["dashboard", "--host", "0.0.0.0", "--port", "9119", "--no-open", "--skip-build"]
          # Même uid que la gateway : un dashboard root réécrivait auth.json et
          # les verrous cron en root, illisibles pour la gateway.
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: A2A_HOST
              value: "0.0.0.0"
            - name: HERMES_DASHBOARD_OAUTH_CLIENT_ID
              value: "agent:cmtz6itql003cgm0a418ks8ng"
            - name: HERMES_DASHBOARD_PUBLIC_URL
              value: "https://node1.tailff2e6.ts.net"
          envFrom:
            - secretRef: {name: hermes-secrets}
            - secretRef: {name: htb-token, optional: true}
            - secretRef: {name: enyo-github, optional: true}
          ports:
            - containerPort: 9119
              name: gateway
          # Auto-réparation : un dashboard figé est redémarré par le kubelet.
          readinessProbe:
            httpGet: {path: /api/status, port: 9119}
            periodSeconds: 20
            timeoutSeconds: 10
          livenessProbe:
            httpGet: {path: /api/status, port: 9119}
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 4
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: webapp-work
              mountPath: /opt/hermes/.web_ui_build.lock
              subPath: web_ui_build.lock
            # Hors PID 1 (pause du shareProcessNamespace), le bootstrap de l'image
            # écrit dans /run/s6 : non inscriptible en uid 10000 sans ce volume.
            - name: s6-run
              mountPath: /run/s6
          resources:
            requests: {cpu: "100m", memory: "384Mi"}
            limits: {cpu: "1", memory: "1Gi"}
        # Gateway (plateformes, dont A2A :9900) : le dashboard ne charge AUCUNE
        # plateforme, la gateway tourne donc dans son propre conteneur.
        # Même image et même HERMES_HOME, rôle séparé. Le port 9900 est porté
        # par ce conteneur ; le Service hermes-a2a (NodePort 30900) le cible.
        - name: gateway
          image: nousresearch/hermes-agent:v0.22.4
          imagePullPolicy: IfNotPresent
          args: ["gateway", "run", "--replace"]
          # L'image refuse (à raison) une gateway root : on la lance
          # directement sous l'utilisateur hermes, comme le ferait l'entrypoint.
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
          ports:
            - containerPort: 9900
              name: a2a
          livenessProbe:
            tcpSocket: {port: 9900}
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: A2A_HOST
              value: "0.0.0.0"
          envFrom:
            - secretRef: {name: hermes-secrets}
            - secretRef: {name: htb-token, optional: true}
            - secretRef: {name: enyo-github, optional: true}
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: s6-run
              mountPath: /run/s6
          resources:
            requests: {cpu: "50m", memory: "256Mi"}
            limits: {cpu: "1", memory: "1Gi"}
        # Lit plugins/audit_to_db/data/audit.db (lecture seule SQLite) et
        # expose des compteurs Prometheus sur :9465/metrics.
        - name: audit-exporter
          image: python:3.12-alpine
          command: ["python3", "/exporter/exporter.py"]
          env:
            - {name: AUDIT_DB, value: /audit/audit.db}
            - {name: PORT, value: "9465"}
            - {name: AGENT_NAME, value: enyo}
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports:
            - containerPort: 9465
              name: metrics
          readinessProbe:
            httpGet: {path: /metrics, port: 9465}
            periodSeconds: 30
          volumeMounts:
            # rw requis par SQLite WAL (fichier -shm), limité au dossier data
            - name: data
              mountPath: /audit
              subPath: plugins/audit_to_db/data
            - name: audit-exporter
              mountPath: /exporter
              readOnly: true
          resources:
            requests: {cpu: "5m", memory: "24Mi"}
            limits: {memory: "64Mi"}
      volumes:
        - name: s6-run
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data-node3
        - name: webapp-work
          emptyDir: {}
        - name: audit-plugin
          configMap:
            name: hermes-audit-plugin
        - name: audit-exporter
          configMap:
            name: hermes-audit-exporter
---
apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: hermes
spec:
  selector:
    app: hermes
  ports:
    - port: 9119
      targetPort: 9119
      name: gateway
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-a2a
  namespace: hermes
spec:
  selector:
    app: hermes
  ports:
    - port: 9900
      targetPort: 9900
      nodePort: 30900
      name: a2a
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-isolation
  namespace: hermes
spec:
  podSelector:
    matchLabels:
      app: hermes
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {protocol: TCP, port: 9900}
        - {protocol: TCP, port: 9119}
    # Prometheus (namespace monitoring) scrape l'audit-exporter
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - {protocol: TCP, port: 9465}
  egress:
    - {}
