apiVersion: v1
kind: Namespace
metadata:
  name: hermes
  labels:
    purpose: agentic-lab
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  namespace: hermes
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
  labels:
    app: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:v2026.8.3
          # ENTRYPOINT /init (s6) conservé ; le CMD (args) EST le programme
          # principal (cf. commentaire du service s6 main-hermes). "serve" =
          # backend headless JSON-RPC/WebSocket, reste actif -> container stable.
          # host loopback par défaut (127.0.0.1) -> accès via port-forward.
          # --skip-build : sert le dist pré-buildé de l'image (évite npm build).
          # gateway run : lance le gateway complet (backend + plateformes).
          # Requis pour A2A (plateforme adapter chargee seulement par le gateway).
          # A2A expose sur 0.0.0.0:9900 avec token (A2A_BEARER_TOKEN, hors Git via
          # secret) -> joignable en Tailscale (node1 100.122.146.39) via NodePort.
          # Sans token il resterait localhost-only ; le token autorise le bind large.
          args: ["gateway", "run"]
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: A2A_HOST
              value: "0.0.0.0"
          envFrom:
            - secretRef: {name: hermes-secrets}   # OPENROUTER_API_KEY + A2A_BEARER_TOKEN, hors Git
          ports:
            - containerPort: 9119
              name: gateway
            - containerPort: 9900
              name: a2a
          volumeMounts:
            - name: data
              mountPath: /opt/data
          resources:
            requests: {cpu: "100m", memory: "384Mi"}
            limits: {cpu: "1", memory: "1Gi"}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
---
apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: hermes
spec:
  selector:
    app: hermes
  ports:
    - port: 9119
      targetPort: 9119
      name: gateway
  type: ClusterIP
---
# Service A2A: expose le port 9900 du pod en NodePort fixe 30900.
# Le node k3s (node1) porte l'IP Tailscale 100.122.146.39, donc A2A devient
# joignable depuis la mesh sur http://100.122.146.39:30900 (token requis).
apiVersion: v1
kind: Service
metadata:
  name: hermes-a2a
  namespace: hermes
spec:
  selector:
    app: hermes
  ports:
    - port: 9900
      targetPort: 9900
      nodePort: 30900
      name: a2a
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-isolation
  namespace: hermes
spec:
  podSelector:
    matchLabels:
      app: hermes
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {protocol: TCP, port: 9900}   # A2A entrant (mesh Tailscale, token requis)
  egress:
    - {}            # egress ouvert (OpenRouter, Telegram, outils)
