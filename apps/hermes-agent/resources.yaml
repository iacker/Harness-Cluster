apiVersion: v1
kind: Namespace
metadata:
  name: hermes
  labels:
    purpose: agentic-lab
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  namespace: hermes
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
  labels:
    app: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: fix-data-permissions
          image: nousresearch/hermes-agent:v2026.8.3
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /opt/data/logs /opt/data/scripts /opt/data/reports
              # Les deux conteneurs tournent en uid 10000 : tout le volume
              # doit lui appartenir (anciens fichiers root = crons et auth
              # illisibles pour la gateway : Permission denied en boucle).
              chown -R 10000:10000 /opt/data
              [ -f /opt/data/auth.json ] && chmod 600 /opt/data/auth.json || true
              chmod 700 /opt/data/logs
              # Verrou de build du webapp (/opt/hermes appartient à root dans
              # l'image) : fichier inscriptible monté par subPath.
              touch /work/web_ui_build.lock && chown 10000:10000 /work/web_ui_build.lock
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: webapp-work
              mountPath: /work
          resources:
            requests: {cpu: "10m", memory: "32Mi"}
            limits: {cpu: "100m", memory: "128Mi"}
      containers:
        - name: hermes
          image: ghcr.io/iacker/hermes-agent:desktop-web-93508
          imagePullPolicy: Always
          args: ["webapp", "--host", "0.0.0.0", "--port", "9119", "--no-open", "--skip-build"]
          # Même uid que la gateway : un webapp root réécrivait auth.json et
          # les verrous cron en root, illisibles pour la gateway.
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: A2A_HOST
              value: "0.0.0.0"
            - name: HERMES_DASHBOARD_OAUTH_CLIENT_ID
              value: "agent:cmtz6itql003cgm0a418ks8ng"
            - name: HERMES_DASHBOARD_PUBLIC_URL
              value: "https://node1.tailff2e6.ts.net"
          envFrom:
            - secretRef: {name: hermes-secrets}
            - secretRef: {name: htb-token, optional: true}
            - secretRef: {name: enyo-github, optional: true}
          ports:
            - containerPort: 9119
              name: gateway
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: webapp-work
              mountPath: /opt/hermes/.web_ui_build.lock
              subPath: web_ui_build.lock
          resources:
            requests: {cpu: "100m", memory: "384Mi"}
            limits: {cpu: "1", memory: "1Gi"}
        # Gateway (plateformes, dont A2A :9900) : `webapp` ne charge AUCUNE
        # plateforme, l'A2A était mort depuis le passage à l'image desktop-web.
        # Même image et même HERMES_HOME, rôle séparé. Le port 9900 est porté
        # par ce conteneur ; le Service hermes-a2a (NodePort 30900) le cible.
        - name: gateway
          image: ghcr.io/iacker/hermes-agent:desktop-web-93508
          imagePullPolicy: Always
          args: ["gateway", "run", "--replace"]
          # L'image refuse (à raison) une gateway root : on la lance
          # directement sous l'utilisateur hermes, comme le ferait l'entrypoint.
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
          ports:
            - containerPort: 9900
              name: a2a
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: A2A_HOST
              value: "0.0.0.0"
          envFrom:
            - secretRef: {name: hermes-secrets}
            - secretRef: {name: htb-token, optional: true}
            - secretRef: {name: enyo-github, optional: true}
          volumeMounts:
            - name: data
              mountPath: /opt/data
          resources:
            requests: {cpu: "50m", memory: "256Mi"}
            limits: {cpu: "1", memory: "1Gi"}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: webapp-work
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: hermes
spec:
  selector:
    app: hermes
  ports:
    - port: 9119
      targetPort: 9119
      name: gateway
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-a2a
  namespace: hermes
spec:
  selector:
    app: hermes
  ports:
    - port: 9900
      targetPort: 9900
      nodePort: 30900
      name: a2a
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-isolation
  namespace: hermes
spec:
  podSelector:
    matchLabels:
      app: hermes
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {protocol: TCP, port: 9900}
        - {protocol: TCP, port: 9119}
  egress:
    - {}
