---
# Alloy = collecteur de logs (successeur de Promtail). DaemonSet qui lit les
# logs conteneurs sur chaque noeud et les pousse vers Loki.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-alloy
  namespace: logging
spec:
  type: default
  interval: 24h
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: logging
spec:
  interval: 30m
  timeout: 8m
  dependsOn:
    - name: loki
  chart:
    spec:
      chart: alloy
      version: "1.11.1"
      sourceRef:
        kind: HelmRepository
        name: grafana-alloy
        namespace: logging
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      type: daemonset
    alloy:
      resources:
        requests: {cpu: 50m, memory: 128Mi}
        limits: {cpu: 200m, memory: 256Mi}
      # config Alloy : decouverte des pods K8s + lecture via API + relais Loki
      configMap:
        content: |
          // Decouverte de tous les pods du cluster
          discovery.kubernetes "pods" {
            role = "pod"
          }

          // Relabel : exposer ns/pod/container/node/app comme labels Loki
          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pods.targets
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app"]
              target_label  = "app"
            }
          }

          // Lecture des logs via l'API Kubernetes (pas de hostPath requis)
          loki.source.kubernetes "pods" {
            targets    = discovery.relabel.pod_logs.output
            forward_to = [loki.write.default.receiver]
          }

          // Destination : Loki
          loki.write "default" {
            endpoint {
              url = "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
            }
          }
