---
# Stack logs : Loki (single-binary, stockage filesystem local-path) + Alloy
# (collecteur de logs par noeud). Complete les 3 piliers avec metrics(Prometheus)
# + energie(Kepler). Volontairement minimal pour un lab 2 noeuds.
apiVersion: v1
kind: Namespace
metadata:
  name: logging
  labels:
    purpose: log-observability
    # Alloy lit /var/log et les logs conteneurs sur l'hote -> hostPath
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: logging
spec:
  type: default
  interval: 24h
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: logging
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: loki
      version: "7.2.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: logging
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # mode mono-binaire = un seul pod loki, pas de microservices ni S3
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      # schema TSDB moderne (obligatoire, sinon le chart refuse de demarrer)
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      storage:
        type: filesystem
      commonConfig:
        replication_factor: 1
      # limites basses pour un lab, retention 7j
      limits_config:
        retention_period: 168h
        volume_enabled: true
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
      pattern_ingester:
        enabled: false
      ruler:
        enabled: false
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        size: 5Gi
        storageClass: local-path
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {cpu: "1", memory: 768Mi}
    # desactiver tous les composants microservices du chart
    backend: {replicas: 0}
    read: {replicas: 0}
    write: {replicas: 0}
    ingester: {replicas: 0}
    querier: {replicas: 0}
    queryFrontend: {replicas: 0}
    queryScheduler: {replicas: 0}
    distributor: {replicas: 0}
    compactor: {replicas: 0}
    indexGateway: {replicas: 0}
    bloomPlanner: {replicas: 0}
    bloomBuilder: {replicas: 0}
    bloomGateway: {replicas: 0}
    # pas de cache externe pour un lab
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    # pas besoin du test-canary ni de gateway nginx
    lokiCanary:
      enabled: false
    test:
      enabled: false
    gateway:
      enabled: false
    minio:
      enabled: false
