apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: goauthentik
  namespace: authentik
spec:
  interval: 24h
  url: https://charts.goauthentik.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: authentik
      version: "2026.8.3"
      sourceRef: {kind: HelmRepository, name: goauthentik}
  install:
    remediation: {retries: 3}
  upgrade:
    remediation: {retries: 3}
  values:
    global:
      nodeSelector:
        kubernetes.io/hostname: node3
    authentik:
      # Toute la config sensible (secret key, mdp DB, bootstrap) vient du
      # Secret SOPS authentik-env (variables AUTHENTIK_*).
      existingSecret:
        secretName: authentik-env
      error_reporting: {enabled: false}
    postgresql:
      enabled: false
    server:
      resources:
        requests: {cpu: 100m, memory: 384Mi}
        limits: {cpu: "1", memory: 1Gi}
      metrics: {enabled: false}
    worker:
      resources:
        requests: {cpu: 50m, memory: 384Mi}
        limits: {cpu: "1", memory: 1Gi}
