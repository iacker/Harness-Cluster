---
# Postgres d'Authentik : joignable uniquement par les pods authentik.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentik-postgresql
  namespace: authentik
spec:
  podSelector:
    matchLabels: {app: authentik-postgresql}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: authentik}
      ports: [{protocol: TCP, port: 5432}]
---
# Server/worker : Traefik (UI, forward-auth), Grafana (token/userinfo OIDC interne),
# Prometheus (metrics) et le namespace lui-même.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentik-server
  namespace: authentik
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: authentik}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
        - podSelector: {}
