# Blueprint Authentik versionné : groupes du lab + SSO Grafana.
# Appliqué automatiquement par le worker (monté via blueprints.configMaps).
# Le client secret vient de l'env (Secret SOPS authentik-env, clé GRAFANA_CLIENT_SECRET).
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints-lab
  namespace: authentik
data:
  lab-sso.yaml: |
    version: 1
    metadata:
      name: lab-sso
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_core.group
        identifiers: {name: lab-admins}
        state: present
      - model: authentik_core.group
        identifiers: {name: lab-operators}
        state: present
      - model: authentik_core.group
        identifiers: {name: lab-viewers}
        state: present
      - model: authentik_providers_oauth2.oauth2provider
        identifiers: {name: grafana}
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: grafana
          client_secret: !Env GRAFANA_CLIENT_SECRET
          # Authentik 2026.8 : sans grant_types explicites -> "Invalid grant_type for provider"
          grant_types: [authorization_code, refresh_token]
          redirect_uris:
            - {matching_mode: strict, url: "https://grafana.k3s-lab.local/login/generic_oauth"}
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          sub_mode: user_username
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      - model: authentik_core.application
        identifiers: {slug: grafana}
        attrs:
          name: Grafana
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, grafana]]
          meta_launch_url: https://grafana.k3s-lab.local/
      # --- Forward-auth (mode domaine) pour les UI sans OIDC : Hermes, Prometheus, Alertmanager.
      # Un seul provider couvre *.k3s-lab.local ; cookie posé sur le domaine.
      - model: authentik_providers_proxy.proxyprovider
        identifiers: {name: lab-forward-auth}
        attrs:
          mode: forward_domain
          external_host: https://auth.k3s-lab.local
          cookie_domain: k3s-lab.local
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          access_token_validity: hours=12
      - model: authentik_core.application
        identifiers: {slug: lab-forward-auth}
        attrs:
          name: Lab (forward-auth)
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, lab-forward-auth]]
          meta_launch_blank: true
      # Accès réservé à lab-admins (l'UI Hermes pilote l'agent).
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, lab-forward-auth]]
          group: !Find [authentik_core.group, [name, lab-admins]]
        attrs: {order: 0}
      - model: authentik_outposts.outpost
        identifiers: {managed: goauthentik.io/outposts/embedded}
        attrs:
          providers:
            - !Find [authentik_providers_proxy.proxyprovider, [name, lab-forward-auth]]
          # Config complète (un attrs.config partiel remplacerait tout le dict).
          # authentik_host vide => redirections vers http://localhost.
          config:
            authentik_host: https://auth.k3s-lab.local/
            authentik_host_browser: ""
            authentik_host_insecure: false
            log_level: info
            refresh_interval: minutes=5
            object_naming_template: ak-outpost-%(name)s
            docker_map_ports: true
            kubernetes_replicas: 1
            kubernetes_namespace: authentik
            kubernetes_service_type: ClusterIP
            kubernetes_ingress_secret_name: authentik-outpost-tls
            kubernetes_disabled_components: []
            kubernetes_image_pull_secrets: []
            kubernetes_ingress_annotations: {}
            kubernetes_httproute_annotations: {}
            kubernetes_httproute_parent_refs: []
            kubernetes_disable_x509_strict: false
      # Tuiles du portail (My applications), sans provider propre.
      - model: authentik_core.application
        identifiers: {slug: hermes}
        attrs: {name: Hermes, meta_launch_url: "https://hermes.k3s-lab.local/"}
      - model: authentik_core.application
        identifiers: {slug: prometheus}
        attrs: {name: Prometheus, meta_launch_url: "https://prometheus.k3s-lab.local/"}
      - model: authentik_core.application
        identifiers: {slug: alertmanager}
        attrs: {name: Alertmanager, meta_launch_url: "https://alertmanager.k3s-lab.local/"}
      # --- MFA obligatoire : un compte sans appareil doit en enrôler un (WebAuthn/YubiKey ou TOTP)
      # au login suivant, au lieu de passer avec le seul mot de passe.
      - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        identifiers: {name: default-authentication-mfa-validation}
        attrs:
          not_configured_action: configure
          device_classes: [static, totp, webauthn]
          configuration_stages:
            - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]
            - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
