# Postgres dédié (le sous-chart bitnami du chart Authentik est désactivé :
# images bitnami gelées). Volume local-path, donc épinglé sur node3.
apiVersion: v1
kind: Service
metadata:
  name: authentik-postgresql
  namespace: authentik
spec:
  selector: {app: authentik-postgresql}
  ports: [{name: pg, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: authentik-postgresql
  namespace: authentik
spec:
  serviceName: authentik-postgresql
  replicas: 1
  selector:
    matchLabels: {app: authentik-postgresql}
  template:
    metadata:
      labels: {app: authentik-postgresql}
    spec:
      nodeSelector:
        kubernetes.io/hostname: node3
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:17.6-alpine
          env:
            - {name: POSTGRES_DB, value: authentik}
            - {name: POSTGRES_USER, value: authentik}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: authentik-env, key: AUTHENTIK_POSTGRESQL__PASSWORD}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, authentik, -d, authentik]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: [pg_isready, -U, authentik, -d, authentik]}
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: {requests: {storage: 5Gi}}
