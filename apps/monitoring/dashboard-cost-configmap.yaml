data:
  cost-eur.json: "{\n  \"annotations\": {\n    \"list\": []\n  },\n  \"editable\": true,\n  \"graphTooltip\": 0,\n  \"title\": \"Co\xFBt \xE9nerg\xE9tique (\u20AC) \u2014 k3s-lab\",\n  \"uid\": \"energie-cout-eur\",\n  \"tags\": [\n    \"kepler\",\n    \"energie\",\n    \"cout\",\n    \"k3s-lab\"\n  ],\n  \"timezone\": \"browser\",\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"time\": {\n    \"from\": \"now-24h\",\n    \"to\": \"now\"\n  },\n  \"refresh\": \"30s\",\n  \"templating\": {\n    \"list\": [\n      {\n        \"name\": \"eur_per_kwh\",\n        \"label\": \"Prix kWh (\u20AC)\",\n        \"type\": \"textbox\",\n        \"query\": \"0.25\",\n        \"current\": {\n          \"text\": \"0.25\",\n          \"value\": \"0.25\"\n        }\n      },\n      {\n        \"name\": \"overhead_w\",\n        \"label\": \"Overhead/n\u0153ud (W hors-RAPL)\",\n        \"type\": \"textbox\",\n        \"query\": \"8\",\n        \"current\": {\n          \"text\": \"8\",\n          \"value\": \"8\"\n        }\n      }\n    ]\n  },\n  \"panels\": [\n    {\n      \"type\": \"text\",\n      \"title\": \"\xC0 lire\",\n      \"gridPos\": {\n        \"h\": 3,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 0\n      },\n      \"options\": {\n        \"mode\": \"markdown\",\n        \"content\": \"**Kepler (RAPL) mesure le CPU + DRAM, pas la machine enti\xE8re.** On ajoute un *overhead* fixe par n\u0153ud (`$overhead_w` W : carte m\xE8re, SSD, ventilos, pertes alim) pour estimer la conso **\xE0 la prise**. Ajuste `Prix kWh` et `Overhead` en haut. Un wattm\xE8tre sur prise permettrait de caler l'overhead au watt pr\xE8s.\"\n      }\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Puissance estim\xE9e \xE0 la prise\",\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 6,\n        \"x\": 0,\n        \"y\": 3\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"watt\",\n          \"decimals\": 1,\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"thresholds\": {\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"yellow\",\n                \"value\": 30\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 60\n              }\n            ]\n          }\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(kepler_node_cpu_watts) + $overhead_w * count(kepler_node_cpu_watts{zone=\\\"package\\\"})\",\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"PDE6745920139CE56\"\n          }\n        }\n      ],\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"PDE6745920139CE56\"\n      }\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Co\xFBt / jour (projet\xE9)\",\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 6,\n        \"x\": 6,\n        \"y\": 3\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"currencyEUR\",\n          \"decimals\": 3,\n          \"color\": {\n            \"mode\": \"fixed\",\n            \"fixedColor\": \"blue\"\n          }\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"(sum(kepler_node_cpu_watts) + $overhead_w * count(kepler_node_cpu_watts{zone=\\\"package\\\"})) / 1000 * 24 * $eur_per_kwh\",\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"PDE6745920139CE56\"\n          }\n        }\n      ],\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"PDE6745920139CE56\"\n      }\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Co\xFBt / mois (projet\xE9)\",\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 6,\n        \"x\": 12,\n        \"y\": 3\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"currencyEUR\",\n          \"decimals\": 2,\n          \"color\": {\n            \"mode\": \"fixed\",\n            \"fixedColor\": \"purple\"\n          }\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"(sum(kepler_node_cpu_watts) + $overhead_w * count(kepler_node_cpu_watts{zone=\\\"package\\\"})) / 1000 * 24 * 30.44 * $eur_per_kwh\",\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"PDE6745920139CE56\"\n          }\n        }\n      ],\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"PDE6745920139CE56\"\n      }\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Co\xFBt / an (projet\xE9)\",\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 6,\n        \"x\": 18,\n        \"y\": 3\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"currencyEUR\",\n          \"decimals\": 2,\n          \"color\": {\n            \"mode\": \"fixed\",\n            \"fixedColor\": \"orange\"\n          }\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"(sum(kepler_node_cpu_watts) + $overhead_w * count(kepler_node_cpu_watts{zone=\\\"package\\\"})) / 1000 * 24 * 365 * $eur_per_kwh\",\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"PDE6745920139CE56\"\n          }\n        }\n      ],\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"PDE6745920139CE56\"\n      }\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Puissance estim\xE9e \xE0 la prise, par n\u0153ud (W)\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 8\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"watt\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 20,\n            \"stacking\": {\n              \"mode\": \"normal\"\n            }\n          }\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(kepler_node_cpu_watts) by (node_name) + $overhead_w\",\n          \"legendFormat\": \"{{node_name}}\",\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"PDE6745920139CE56\"\n          }\n        }\n      ],\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"PDE6745920139CE56\"\n      }\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Co\xFBt mensuel projet\xE9 dans le temps (\u20AC)\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 8\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"currencyEUR\",\n          \"decimals\": 2,\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 15\n          }\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"(sum(kepler_node_cpu_watts) + $overhead_w * count(kepler_node_cpu_watts{zone=\\\"package\\\"})) / 1000 * 24 * 30.44 * $eur_per_kwh\",\n          \"legendFormat\": \"co\xFBt mensuel projet\xE9\",\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"PDE6745920139CE56\"\n          }\n        }\n      ],\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"PDE6745920139CE56\"\n      }\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"\xC9nergie CPU r\xE9elle mesur\xE9e (kWh) \u2014 sur la plage\",\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 8,\n        \"x\": 0,\n        \"y\": 16\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"kwatth\",\n          \"decimals\": 4,\n          \"color\": {\n            \"mode\": \"fixed\",\n            \"fixedColor\": \"green\"\n          }\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(increase(kepler_node_cpu_joules_total[$__range])) / 3600000\",\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"PDE6745920139CE56\"\n          }\n        }\n      ],\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"PDE6745920139CE56\"\n      }\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Co\xFBt CPU r\xE9el mesur\xE9 (\u20AC) \u2014 sur la plage (RAPL seul)\",\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 8,\n        \"x\": 8,\n        \"y\": 16\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"currencyEUR\",\n          \"decimals\": 4,\n          \"color\": {\n            \"mode\": \"fixed\",\n            \"fixedColor\": \"green\"\n          }\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(increase(kepler_node_cpu_joules_total[$__range])) / 3600000 * $eur_per_kwh\",\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"PDE6745920139CE56\"\n          }\n        }\n      ],\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"PDE6745920139CE56\"\n      }\n    },\n    {\n      \"type\": \"piechart\",\n      \"title\": \"R\xE9partition puissance CPU par namespace (W)\",\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 8,\n        \"x\": 16,\n        \"y\": 16\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"right\",\n          \"values\": [\n            \"value\"\n          ]\n        }\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"watt\",\n          \"decimals\": 2\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sort_desc(sum(kepler_container_cpu_watts) by (container_namespace))\",\n          \"legendFormat\": \"{{container_namespace}}\",\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"PDE6745920139CE56\"\n          }\n        }\n      ],\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"PDE6745920139CE56\"\n      }\n    }\n  ]\n}\n"
