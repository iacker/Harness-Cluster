---
# Isolation reseau du namespace monitoring.
# - Ingress: seulement depuis le namespace monitoring lui-meme (grafana<->prometheus).
#   Les sondes kubelet et le port-forward passent par le noeud (host) et ne sont
#   pas bloques par une policy a base de podSelector.
# - Egress: ouvert (prometheus doit scraper kepler.kepler:28282 + resoudre le DNS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-isolation
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    # harnais de mesure Kepler Field-Lab : lecture seule de l'API Prometheus
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kepler-lab
      ports:
        - protocol: TCP
          port: 9090
    # autoriser Traefik (kube-system) a joindre Grafana pour l'Ingress TLS
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - {}
