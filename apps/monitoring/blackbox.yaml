---
# Sondes HTTP "vues de l'utilisateur" : passent par Traefik
# (traefik.kube-system.svc + parametre ?hostname= pour le Host/SNI), comme un
# vrai navigateur. Trafic 100 % interne au cluster.
# Ne JAMAIS sonder les URL publiques Azure d'ici : chaque reponse serait de
# l'egress facture cote Azure.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox
  namespace: monitoring
spec:
  interval: 30m
  timeout: 5m
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: "11.20.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    nodeSelector: {kubernetes.io/hostname: node3}
    resources:
      requests: {cpu: 10m, memory: 24Mi}
      limits: {cpu: 100m, memory: 64Mi}
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 10s
          http:
            preferred_ip_protocol: ip4
            follow_redirects: false
            valid_status_codes: [200, 204]
            tls_config:
              insecure_skip_verify: true   # CA du lab
        # Hermes dashboard : 302 vers /login = l'appli repond
        http_302:
          prober: http
          timeout: 10s
          http:
            preferred_ip_protocol: ip4
            follow_redirects: false
            valid_status_codes: [302]
