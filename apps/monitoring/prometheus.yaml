---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    purpose: energy-observability
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring-system
  labels:
    purpose: node-observability
    # node-exporter necessite hostNetwork/hostPID/hostPath
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: monitoring
spec:
  type: default
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: monitoring
spec:
  type: default
  interval: 24h
  url: https://grafana.github.io/helm-charts
---
# Prometheus minimal : server seul, scrape uniquement Kepler.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 30m
  timeout: 8m
  chart:
    spec:
      chart: prometheus
      version: "29.23.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # --- observabilite cluster complete : KSM + node-exporter actives ---
    alertmanager:
      enabled: true
      # monter le secret SOPS (token + chat_id) dans le pod alertmanager
      extraSecretMounts:
        - name: telegram
          secretName: alertmanager-telegram
          mountPath: /etc/alertmanager/telegram
          readOnly: true
      config:
        global:
          resolve_timeout: 5m
        route:
          group_by: ['alertname', 'namespace']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          receiver: telegram
        receivers:
          - name: telegram
            telegram_configs:
              - bot_token_file: /etc/alertmanager/telegram/bot_token
                chat_id: 7734064984
                api_url: https://api.telegram.org
                parse_mode: HTML
                message: |
                  {{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} <b>{{ .CommonLabels.alertname }}</b>
                  <b>Statut:</b> {{ .Status }}
                  {{ range .Alerts }}<b>ns:</b> {{ .Labels.namespace }} <b>pod:</b> {{ .Labels.pod }}
                  {{ .Annotations.description }}
                  {{ end }}
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 64Mi}
    kube-state-metrics:
      enabled: true           # etat des objets K8s (pods, deploy, ds...)
    prometheus-node-exporter:
      enabled: true           # metriques hote (cpu/ram/disk/net par noeud)
      # node-exporter a besoin de hostNetwork/hostPID/hostPath -> incompatible
      # PSS baseline du ns monitoring. On le deporte dans un ns dedie privileged.
      namespaceOverride: monitoring-system
      resources:
        requests: {cpu: 20m, memory: 32Mi}
        limits: {cpu: 100m, memory: 64Mi}
    prometheus-pushgateway:
      enabled: false
    server:
      retention: "7d"
      persistentVolume:
        enabled: true
        size: 2Gi
        storageClass: local-path
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1536Mi
      global:
        scrape_interval: 30s
    # scrape statique de l'endpoint Kepler (svc kepler.kepler:28282)
    serverFiles:
      alerting_rules.yml:
        groups:
          - name: k3s-lab-sante
            rules:
              - alert: PodCrashLooping
                expr: rate(kube_pod_container_status_restarts_total[10m]) * 600 > 3
                for: 5m
                labels: {severity: critical}
                annotations:
                  description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} redemarre en boucle (>3/10min)."
              - alert: PodNotReady
                # Les pods de Jobs termines sont volontairement non Ready.
                # Ne surveiller que les pods encore actifs.
                expr: |
                  sum by (namespace, pod) (
                    kube_pod_status_ready{condition="false"} == 1
                  ) > 0
                  and on (namespace, pod)
                  sum by (namespace, pod) (
                    kube_pod_status_phase{phase=~"Pending|Running|Unknown"} == 1
                  ) > 0
                for: 15m
                labels: {severity: warning}
                annotations:
                  description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} non Ready depuis 15min."
              - alert: NodeNotReady
                expr: kube_node_status_condition{condition="Ready",status="true"} == 0
                for: 5m
                labels: {severity: critical}
                annotations:
                  description: "Noeud {{ $labels.node }} NotReady depuis 5min."
              - alert: NodeMemoryPressure
                expr: kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
                for: 5m
                labels: {severity: warning}
                annotations:
                  description: "Noeud {{ $labels.node }} sous pression memoire."
              - alert: PVCAlmostFull
                expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.10
                for: 10m
                labels: {severity: warning}
                annotations:
                  description: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} <10% libre."
    extraScrapeConfigs: |
      - job_name: kepler
        static_configs:
          - targets:
              - kepler.kepler.svc.cluster.local:28282
        metrics_path: /metrics
      # kubelet cAdvisor (metriques conteneurs/pods par noeud)
      - job_name: kubelet-cadvisor
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
