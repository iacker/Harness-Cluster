apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - prometheus.yaml
  - dashboard-configmap.yaml
  - dashboard-cost-configmap.yaml
  - grafana.yaml
  - networkpolicy.yaml
  - rbac-nodes-proxy.yaml
  - ingress.yaml
  - ingress-protected.yaml
  - alertmanager-secret.sops.yaml
  - grafana-oidc-secret.sops.yaml
  - grafana-admin-secret.sops.yaml
# Dashboard dédié Enyo (audit agent Hermes), séparé des dashboards énergie/coût
configMapGenerator:
  - name: grafana-dashboard-enyo
    namespace: monitoring
    files:
      - enyo-hermes-audit.json=dashboard-enyo.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
