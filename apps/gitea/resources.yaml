apiVersion: v1
kind: Namespace
metadata:
  name: gitea
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: gitea
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: gitea
  labels: { app: gitea }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: gitea }
  template:
    metadata:
      labels: { app: gitea }
    spec:
      nodeSelector:
        kubernetes.io/hostname: cloud4dev
      securityContext:
        fsGroup: 1000
      containers:
        - name: gitea
          image: gitea/gitea:1.22.6
          imagePullPolicy: IfNotPresent
          env:
            - { name: USER_UID, value: "1000" }
            - { name: USER_GID, value: "1000" }
            - { name: GITEA__database__DB_TYPE, value: "sqlite3" }
            - { name: GITEA__server__DOMAIN, value: "100.83.189.79" }
            - { name: GITEA__server__ROOT_URL, value: "http://100.83.189.79:30300/" }
            - { name: GITEA__server__SSH_PORT, value: "30022" }
            - { name: GITEA__server__SSH_LISTEN_PORT, value: "22" }
            - { name: GITEA__service__DISABLE_REGISTRATION, value: "true" }
            - { name: GITEA__security__INSTALL_LOCK, value: "true" }
            - { name: GITEA__server__OFFLINE_MODE, value: "true" }
          ports:
            - { name: http, containerPort: 3000 }
            - { name: ssh, containerPort: 22 }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /api/healthz, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-data
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: gitea
spec:
  type: NodePort
  selector: { app: gitea }
  ports:
    - { name: http, port: 3000, targetPort: 3000, nodePort: 30300 }
    - { name: ssh, port: 22, targetPort: 22, nodePort: 30022 }
