---
apiVersion: v1
kind: Namespace
metadata:
  name: kepler
  labels:
    purpose: energy-observability
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kepler
  namespace: kepler
spec:
  type: oci
  interval: 24h
  url: oci://quay.io/sustainable_computing_io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kepler
  namespace: kepler
spec:
  interval: 30m
  timeout: 5m
  chart:
    spec:
      chart: kepler
      version: "0.11.4"
      sourceRef:
        kind: HelmRepository
        name: kepler
        namespace: kepler
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    namespace:
      create: false
      name: kepler
    config:
      log:
        level: info          # defaut 'debug' trop verbeux
        format: text
      # NB: ne PAS mettre kube.enabled=true ici. Le chart 0.11.4 valide le
      # fichier de config AVANT d'appliquer le flag CLI --kube.node-name=$(NODE_NAME),
      # donc kube.enabled=true dans le ConfigMap avec nodeName vide fait crash
      # (kube.node-name not supplied). Le DaemonSet active deja le mapping K8s
      # via l'argument CLI + downward API NODE_NAME. On laisse le defaut.
      exporter:
        prometheus:
          enabled: true
      experimental:
        gpu:
          enabled: false     # pas de GPU sur les Celeron
    daemonset:
      hostPID: true
      # liveness par defaut = timeoutSeconds:1 -> trop court : sur node1
      # (control-plane charge) /metrics peut prendre >1s (collecte ~1.2s),
      # d'ou 3 echecs -> kill -> crashloop. On elargit le timeout + tolerance.
      livenessProbe:
        httpGet:
          path: /metrics
          port: http
        initialDelaySeconds: 15
        periodSeconds: 60
        timeoutSeconds: 10
        failureThreshold: 5
      securityContext:
        privileged: true
        runAsNonRoot: false
      # tourner sur TOUS les noeuds (le defaut du chart tolere deja control-plane/master)
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      # noeuds Celeron 4Go/2c : bornes basses mais confortables
      # Pas de limit CPU: mesure du 18/08, kepler etait throttle sur 84% des
      # fenetres CFS avec limits.cpu=200m, alors que le noeud avait du CPU libre.
      # Le request suffit a garantir la part sous contention.
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
    serviceMonitor:
      enabled: false          # passer a true si Prometheus-Operator installe
---
# Isolation reseau kepler : ingress uniquement depuis monitoring sur le port
# metrics (28282). Egress non restreint (kepler lit le host / RAPL).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kepler-isolation
  namespace: kepler
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 28282
