---
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
  labels:
    purpose: policy-as-code
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kyverno
  namespace: kyverno
spec:
  type: default
  interval: 24h
  url: https://kyverno.github.io/kyverno/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 30m
  timeout: 8m
  chart:
    spec:
      chart: kyverno
      version: "3.8.2"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: kyverno
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # lab 2 noeuds : 1 replica par composant (pas de HA)
    admissionController:
      replicas: 1
      # node1 (control-plane, 2 vCPU) sature en I/O: les probes par defaut
      # (timeout 5s, failureThreshold 2) tuent le pod des que l'API ralentit,
      # ce qui vide kyverno-svc et bloque TOUTE creation de pod (webhook Fail).
      livenessProbe:
        httpGet: {path: /health/liveness, port: 9443, scheme: HTTPS}
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 15
        failureThreshold: 10
        successThreshold: 1
      readinessProbe:
        httpGet: {path: /health/readiness, port: 9443, scheme: HTTPS}
        initialDelaySeconds: 15
        periodSeconds: 15
        timeoutSeconds: 15
        failureThreshold: 12
        successThreshold: 1
      resources:
        requests: {cpu: 50m, memory: 128Mi}
        limits: {cpu: 500m, memory: 384Mi}
    backgroundController:
      # Deporte sur cloud4dev: node1 (control-plane, 2 vCPU / 3.8Go) est
      # sature. L'admission controller reste sur node1 car il est sur le
      # chemin critique des requetes API.
      nodeSelector:
        kubernetes.io/hostname: cloud4dev
      resources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {cpu: 200m, memory: 128Mi}
    cleanupController:
      resources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {cpu: 200m, memory: 128Mi}
    reportsController:
      # Desactive: ce controleur reecrit en continu les PolicyReports dans le
      # datastore SQLite de k3s, ce qui sature les I/O de node1 (2 vCPU).
      # Il a ete observe bloque en etat D pendant l'incident du 18/08.
      # L'enforcement admission (la vraie valeur securite) n'est pas impacte:
      # seuls les rapports d'audit disparaissent.
      enabled: false
      resources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {cpu: 200m, memory: 128Mi}
