# Hindsight n'est joignable que par Ényo (namespace hermes) et en interne.
# Pas d'Ingress, pas de NodePort : la mémoire d'Ényo ne sort pas du cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hindsight-ingress
  namespace: hindsight
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: hermes}}
